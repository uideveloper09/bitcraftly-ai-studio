services:
  postgres:
    image: postgres:16-alpine
    container_name: bitcraftly-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: bitcraftly
      POSTGRES_PASSWORD: bitcraftly
      POSTGRES_DB: bitcraftly_ai_studio
    ports:
      - '5432:5432'
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U bitcraftly -d bitcraftly_ai_studio']
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    container_name: bitcraftly-redis
    restart: unless-stopped
    ports:
      - '6379:6379'
    volumes:
      - redis_data:/data
    healthcheck:
      test: ['CMD', 'redis-cli', 'ping']
      interval: 5s
      timeout: 5s
      retries: 10

  api:
    build:
      context: ..
      dockerfile: docker/Dockerfile.api
    container_name: bitcraftly-api
    restart: unless-stopped
    env_file:
      - ../.env
    environment:
      DATABASE_URL: postgresql://bitcraftly:bitcraftly@postgres:5432/bitcraftly_ai_studio?schema=public
      REDIS_URL: redis://redis:6379
      API_URL: http://localhost:4000
      APP_URL: http://localhost:3000
    ports:
      - '4000:4000'
    volumes:
      - ../storage:/app/storage
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

  web:
    build:
      context: ..
      dockerfile: docker/Dockerfile.web
    container_name: bitcraftly-web
    restart: unless-stopped
    environment:
      NEXT_PUBLIC_API_URL: http://localhost:4000
      BETTER_AUTH_URL: http://localhost:3000
      BETTER_AUTH_SECRET: change-me-to-a-long-random-secret-at-least-32-chars
      DATABASE_URL: postgresql://bitcraftly:bitcraftly@postgres:5432/bitcraftly_ai_studio?schema=public
    ports:
      - '3000:3000'
    depends_on:
      - api

volumes:
  postgres_data:
  redis_data:
